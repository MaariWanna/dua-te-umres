<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8">

<title>Duatë e Umres</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1f2430;--mu:#6b7080;--bd:#e6e0d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2028;--tx:#eceae4;--mu:#9aa0ae;--bd:#2c303b}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2028;--tx:#eceae4;--mu:#9aa0ae;--bd:#2c303b}
html{scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--bd)}
h1{font:700 26px Amiri,serif;margin:0 0 8px;text-align:center}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);min-width:0}
button{font:inherit;cursor:pointer;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px}
.bar{display:flex;gap:8px;margin-top:8px}.bar button{font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.cat{border:0;color:#fff;border-radius:20px;padding:26px 12px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.cat span{font-size:52px;line-height:1}.cat small{font-weight:400;opacity:.9}
.dua{background:var(--card);border:1px solid var(--bd);border-right:8px solid var(--c);border-radius:14px;margin:16px 0;padding:14px 16px 6px}
.dua h2{margin:0 0 6px;font-size:15px;color:var(--c)}
.dua p{font:400 28px/2.3 Amiri,'Traditional Arabic',serif;direction:rtl;text-align:right;margin:0 0 6px}
.dua+.dua{}.none{text-align:center;color:var(--mu);margin-top:40px}
[hidden]{display:none!important}
@media(max-width:420px){.dua p{font-size:26px}}

<script>
const D=[{"c":"t","t":"Duaja e nisjes së udhëtimit","k":"udhetim nisje","a":["رَبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَلْ لِي مِنْ لَدُنْكَ سُلْطَانًا نَصِيرًا","اللَّهُمَّ إِنِّي أَسْتَعِينُكَ وَأَتَوَكَّلُ عَلَيْكَ","اللَّهُمَّ سَهِّلْ لِي أَمْرِي وَسَفَرِي، وَأَعْطِنِي مِنَ الْخَيْرِ أَكْثَرَ مِمَّا أَطْلُبُ، وَاصْرِفْ عَنِّي كُلَّ سُوءٍ","رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","اللَّهُمَّ إِنِّي أَسْتَوْدِعُكَ نَفْسِي وَدِينِي وَأَهْلِي وَأَقَارِبِي وَجَمِيعَ مَا أَنْعَمْتَ بِهِ عَلَيَّ فِي الدُّنْيَا وَالْآخِرَةِ، يَا كَرِيمُ احْفَظْنَا مِنْ كُلِّ سُوءٍ"],"s":1,"i":0},{"c":"t","t":"Duaja e hipjes në automjet","k":"udhetim automjet","a":["بِسْمِ اللَّهِ، وَالْحَمْدُ لِلَّهِ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى","اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ","اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ"],"s":1,"i":1},{"c":"t","t":"Duaja e hyrjes në Harem","k":"harem hyrje","a":["اللَّهُمَّ هَذَا حَرَمُكَ وَأَمْنُكَ، فَحَرِّمْ لَحْمِي وَدَمِي عَلَى النَّارِ، وَأَمِنِّي مِنْ عَذَابِكَ يَوْمَ تَبْعَثُ عِبَادَكَ، وَاجْعَلْنِي مِنْ أَوْلِيَائِكَ وَأَهْلِ طَاعَتِكَ"],"s":1,"i":2},{"c":"u","t":"Nijeti i Umres","k":"nijet umre","a":["اللَّهُمَّ إِنِّي أُرِيدُ الْعُمْرَةَ فَيَسِّرْهَا لِي وَتَقَبَّلْهَا مِنِّي"],"s":0,"i":3},{"c":"u","t":"Telbije","k":"telbije labbejk","a":["لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ ،","لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ ، لَا شَرِيكَ لَكَ"],"s":1,"i":4},{"c":"u","t":"Duaja e hyrjes në xhami","k":"mesxhid hyrje","a":["بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، أَعُوذُ بِاللَّهِ الْعَظِيمِ وَبِوَجْهِهِ الْكَرِيمِ وَسُلْطَانِهِ الْقَدِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ وَاغْفِرْ لِي ذُنُوبِي"],"s":1,"i":5},{"c":"u","t":"Duaja kur shihet Qabja","k":"kabe kaabe","a":["اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، لَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، وَلِلَّهِ الْحَمْدُ","اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً، وَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ وَاعْتَمَرَهُ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَبِرًّا","اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، حَيِّنَا رَبَّنَا بِالسَّلَامِ"],"s":1,"i":6},{"c":"u","t":"Nijeti i Tavafit","k":"nijet tavaf","a":["اللَّهُمَّ إِنِّي أُرِيدُ طَوَافَ بَيْتِكَ الْحَرَامِ سَبْعَةَ أَشْوَاطٍ فَيَسِّرْهُ لِي وَتَقَبَّلْهُ مِنِّي"],"s":0,"i":7},{"c":"u","t":"Duaja para Tavafit / në fillim të çdo shavti","k":"tavaf shavt","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ"],"s":1,"i":8},{"c":"u","t":"Duaja midis Jemenit dhe Haxherul-Esved","k":"tavaf jemen haxher esved","a":["رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":9},{"c":"u","t":"Duaja e shavtit të 1-të të Tavafit","k":"tavaf shavt 1","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","رَبَّنَا تَقَبَّلْ مِنَّا، إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ","رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَا أُمَّةً مُسْلِمَةً لَكَ، وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","اللَّهُمَّ اجْعَلْ سَعْيِي مَشْكُورًا، وَذَنْبِي مَغْفُورًا، وَعَمَلِي مَقْبُولًا، وَتِجَارَتِي لَنْ تَبُورَ","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدِّينِ وَالدُّنْيَا وَالْآخِرَةِ","اللَّهُمَّ اقْضِ لَنَا فِي هَذَا الْمَكَانِ أَفْضَلَ مَا تَقْضِي بِهِ لِعِبَادِكَ الصَّالِحِينَ","اللَّهُمَّ إِنِّي عَبْدُكَ وَابْنُ عَبْدِكَ وَابْنُ أَمَتِكَ، جِئْتُكَ طَالِبًا مَرْضَاتَكَ، أَسْأَلُكَ أَنْ تُغْفِرَ لِي وَتَرْحَمَنِي وَتَجْعَلَنِي مِنْ أَهْلِ طَاعَتِكَ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":10},{"c":"u","t":"Duaja e shavtit të 2-të të Tavafit","k":"tavaf shavt 2","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","رَبِّ اغْفِرْ لِي، إِنِّي ظَلَمْتُ نَفْسِي، فَاغْفِرْ لِي","سُبْحَانَكَ لَا إِلَهَ إِلَّا أَنْتَ، إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","اللَّهُمَّ إِنَّ هَذَا الْبَيْتَ بَيْتُكَ، وَهَذَا الْحَرَمَ حَرَمُكَ، وَهَذَا الْأَمْنُ أَمْنُكَ، وَأَنَا عَبْدُكَ وَابْنُ عَبْدِكَ، جِئْتُكَ بِذُنُوبٍ كَثِيرَةٍ وَأَعْمَالٍ سَيِّئَةٍ، وَهَذَا مَقَامُ الْعَائِذِ بِكَ مِنَ النَّارِ، فَحَرِّمْ لَحْمِي وَدَمِي عَلَى النَّارِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ أَنْ تَغْفِرَ لِي ذُنُوبِي وَتَرْحَمَنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ","رَبِّ اغْفِرْ وَارْحَمْ، وَأَنْتَ خَيْرُ الرَّاحِمِينَ","رَبِّ زِدْنِي عِلْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ","اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا، وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ","اللَّهُمَّ اجْعَلْ سَعْيِي مَشْكُورًا، وَذَنْبِي مَغْفُورًا، وَعَمَلِي مَقْبُولًا، وَتِجَارَتِي لَنْ تَبُورَ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":11},{"c":"u","t":"Duaja e shavtit të 3-të të Tavafit","k":"tavaf shavt 3","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ","اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخِيَانَةِ وَالْكُفْرِ وَالشِّرْكِ وَالنِّفَاقِ وَالرِّيَاءِ وَسُوءِ الْأَخْلَاقِ","اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا","اللَّهُمَّ اجْعَلْ سَعْيِي مَشْكُورًا، وَذَنْبِي مَغْفُورًا، وَعَمَلِي مَقْبُولًا، وَتِجَارَتِي لَنْ تَبُورَ","يَا عَالِمَ مَا فِي الْقُلُوبِ، أَخْرِجْنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ يَا اللَّهُ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":12},{"c":"u","t":"Duaja e shavtit të 4-të të Tavafit","k":"tavaf shavt 4","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","اللَّهُمَّ إِنِّي أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ، وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ، وَالْفَوْزَ بِالْجَنَّةِ وَالنَّجَاةَ مِنَ النَّارِ","رَبِّ قِنِي بِمَا رَزَقْتَنِي وَبَارِكْ لِي فِيمَا أَعْطَيْتَنِي وَاخْلُفْ لِي خَيْرًا مِنْ كُلِّ غَائِبَةٍ","رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا","رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا","رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ، وَاعْفُ عَنَّا، وَاغْفِرْ لَنَا، وَارْحَمْنَا، أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ، وَعَمَلِي مِنَ الرِّيَاءِ، وَلِسَانِي مِنَ الْكَذِبِ، وَعَيْنِي مِنَ الْخِيَانَةِ، فَإِنَّكَ تَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ","اللَّهُمَّ اهْدِنِي لِأَحْسَنِ الْأَعْمَالِ وَأَحْسَنِ الْأَخْلَاقِ، فَإِنَّهُ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَقِنِي سَيِّئَ الْأَعْمَالِ وَسَيِّئَ الْأَخْلَاقِ، فَإِنَّهُ لَا يَقِي سَيِّئَهَا إِلَّا أَنْتَ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":13},{"c":"u","t":"Duaja e shavtit të 5-të të Tavafit","k":"tavaf shavt 5","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً، إِنَّكَ سَمِيعُ الدُّعَاءِ","رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي، رَبَّنَا وَتَقَبَّلْ دُعَاءِ","رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ","رَبِّ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ","رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","اللَّهُمَّ أَظِلَّنِي تَحْتَ ظِلِّ عَرْشِكَ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّكَ، وَاسْقِنِي مِنْ حَوْضِ نَبِيِّكَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ شَرْبَةً لَا أَظْمَأُ بَعْدَهَا أَبَدًا","اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَعُوذُ بِكَ مِنَ الشَّرِّ كُلِّهِ عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ","اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَرَسُولُكَ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَكَ مِنْهُ عَبْدُكَ وَرَسُولُكَ مُحَمَّدٌ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":14},{"c":"u","t":"Duaja e shavtit të 6-të të Tavafit","k":"tavaf shavt 6","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا","وَاكْتُبْ لَنَا فِي هَذِهِ الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ إِنَّا هُدْنَا إِلَيْكَ","رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ","رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا، رَبَّنَا إِنَّكَ رَءُوفٌ رَحِيمٌ","اللَّهُمَّ إِنَّ عَلَيَّ حُقُوقًا كَثِيرَةً لِخَلْقِكَ، وَلَكَ عَلَيَّ حُقُوقٌ كَثِيرَةٌ، اللَّهُمَّ فَاغْفِرْ لِي مَا قَصَّرْتُ فِيهِ مِنْ حُقُوقِكَ، وَاقْضِ عَنِّي مَا لَزِمَنِي مِنْ حُقُوقِ خَلْقِكَ، وَأَغْنِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَبِطَاعَتِكَ عَنْ مَعْصِيَتِكَ، وَبِفَضْلِكَ عَمَّنْ سِوَاكَ، يَا وَاسِعَ الْمَغْفِرَةِ","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","وَأَدْخِلْنَا الْجَنَّةَ مَعَ الْأَبْرَارِ، يَا عَزِيزُ يَا غَفَّارُ يَا رَبَّ الْعَالَمِينَ"],"s":1,"i":15},{"c":"u","t":"Duaja e shavtit të 7-të të Tavafit","k":"tavaf shavt 7","a":["بِسْمِ اللَّهِ، اللَّهُ أَكْبَرُ، اللَّهُمَّ إِيمَانًا بِكَ، وَتَصْدِيقًا بِكِتَابِكَ، وَوَفَاءً بِعَهْدِكَ، وَاتِّبَاعًا لِسُنَّةِ نَبِيِّكَ","سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ","الصَّلَاةُ وَالسَّلَامُ عَلَى سَيِّدِنَا مُحَمَّدٍ","اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَانًا كَامِلًا، وَيَقِينًا صَادِقًا، وَرِزْقًا وَاسِعًا حَلَالًا طَيِّبًا، وَقَلْبًا خَاشِعًا، وَلِسَانًا ذَاكِرًا، وَتَوْبَةً نَصُوحًا، وَعِلْمًا نَافِعًا","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","اللَّهُمَّ إِنِّي أَسْأَلُكَ قَلْبًا سَلِيمًا وَلِسَانًا صَادِقًا","اللَّهُمَّ إِنِّي أَسْأَلُكَ الصِّحَّةَ وَالْعِفَّةَ وَالْأَمَانَةَ وَحُسْنَ الْخُلُقِ وَالرِّضَا بِالْقَدَرِ","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْخَيْرَ وَأَعْمَالَ الْخَيْرِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَغْفِرَ لِي وَتَرْحَمَنِي","اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، إِنَّكَ أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ","اللَّهُمَّ لَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَلَا تَنْزِعْ مِنِّي صَالِحَ مَا أَعْطَيْتَنِي","رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ","رَبَّنَا آتِنَا فِي الدُّ"],"s":1,"i":16},{"c":"u","t":"Nijeti i Sajit","k":"nijet saj","a":["اللَّهُمَّ إِنِّي أُرِيدُ السَّعْيَ بَيْنَ الصَّفَا وَالْمَرْوَةِ سَبْعَةَ أَشْوَاطٍ فَيَسِّرْهُ لِي وَتَقَبَّلْهُ مِنِّي"],"s":0,"i":17},{"c":"u","t":"Duaja në Safa","k":"saj safa","a":["إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ"],"s":0,"i":18},{"c":"m","t":"Selami ndaj Pejgamberit","k":"medine pejgamber selam","a":["السَّلَامُ عَلَيْكَ يَا رَسُولَ اللَّهِ","السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ"],"s":0,"i":19},{"c":"m","t":"Selami ndaj Ebu Bekrit","k":"medine ebu bekr selam","a":["السَّلَامُ عَلَيْكَ يَا أَبَا بَكْرٍ الصِّدِّيقَ رَضِيَ اللَّهُ عَنْكَ"],"s":0,"i":20},{"c":"m","t":"Selami ndaj Omerit","k":"medine omer selam","a":["السَّلَامُ عَلَيْكَ يَا عُمَرَ الْفَارُوقَ رَضِيَ اللَّهُ عَنْكَ"],"s":0,"i":21},{"c":"g","t":"Duaja e Zemzemit","k":"zemzem","a":["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا وَاسِعًا وَشِفَاءً مِنْ كُلِّ دَاءٍ وَسَقَمٍ"],"s":1,"i":22},{"c":"g","t":"Tekbir","k":"tekbir","a":["اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، لَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ وَلِلَّهِ الْحَمْدُ"],"s":1,"i":23},{"c":"g","t":"Tehlil","k":"tehlil","a":["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"],"s":1,"i":24},{"c":"g","t":"Tesbih","k":"tesbih","a":["سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ"],"s":1,"i":25},{"c":"g","t":"Salavatet (Salavat-i Sherif)","k":"salavat salavatet","a":["اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ","اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ","اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ"],"s":1,"i":26},{"c":"g","t":"Duaja e daljes nga xhamia","k":"mesxhid dalje","a":["بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ"],"s":1,"i":27}];
const C={t:['Duatë e Udhëtimit','#8B5CF6','✈️'],u:['Duatë e Umres','#10B981','🕋'],m:['Duatë e Vizitave në Medine','#F97316','🕌'],g:['Duatë e Përgjithshme','#EF4444','🤲']};
const $=i=>document.getElementById(i),q=$('q');
const nz=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[إأآ]/g,'ا').toLowerCase();
$('home').innerHTML=Object.keys(C).map(k=>`<button class="cat" data-k="${k}" style="background:${C[k][1]}"><span>${C[k][2]}</span>${C[k][0]}<small>${D.filter(d=>d.c==k).length} dua</small></button>`).join('');
function card(d){const c=C[d.c];return `<article class="dua" style="--c:${c[1]}"><h2>${d.t}</h2>${d.a.map(x=>`<p>${x}</p>`).join('')}</article>`}
function render(){let cat=null,s=q.value.trim();try{cat=location.hash.slice(1)||null}catch(e){}
 const h=!s&&!cat;$('home').hidden=!h;$('back').hidden=h;$('clr').hidden=!s;
 let r=[];if(s){const n=nz(s);r=D.filter(d=>nz(d.t+' '+d.k+' '+d.a.join(' ')).includes(n))}else if(cat)r=D.filter(d=>d.c==cat);
 $('list').innerHTML=h?'':(r.length?(!s?`<h2 style="color:${C[cat][1]}">${C[cat][0]}</h2>`:'')+r.map(card).join(''):'<p class="none">Nuk u gjet asnjë dua.</p>');
 scrollTo({top:0})}
$('home').onclick=e=>{const b=e.target.closest('.cat');if(b){try{location.hash=b.dataset.k}catch(x){}render()}};
$('back').onclick=()=>{q.value='';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}render()};
$('clr').onclick=()=>{q.value='';render();q.focus()};
q.oninput=render;addEventListener('hashchange',render);render();
</script></body></html>
